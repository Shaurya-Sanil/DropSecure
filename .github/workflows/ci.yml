name: CI - Code Quality & Infrastructure Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Backend Build & Typecheck
        run: npm run build --workspace=backend

      - name: Run Backend Vitest Unit & Integration Tests
        run: npm test --workspace=backend

      - name: Worker Build & Typecheck
        run: npm run build --workspace=worker

      - name: Frontend Build & Typecheck
        run: npm run build --workspace=frontend

  terraform-checks:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.5'

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (Validation only)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate
